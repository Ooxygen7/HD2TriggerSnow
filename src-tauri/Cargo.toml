[package]
name = "hd2-macro-terminal-rust"
version = "0.1.0"
description = "A lightweight Windows x64 rewrite of HD2 Macro Terminal"
authors = ["Huizhixin"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "devtools"] }
thiserror = "2"
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
ort = "2.0.0-rc.12"
image = "0.24.9"
screenshots = "0.8.10"
