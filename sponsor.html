<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感谢您的赞助</title>
    <style>
        :root {
            --hd-yellow: #ffe80a;
            --hd-bg: #050505;
            --hd-panel: #101010;
            --hd-border: rgba(255, 232, 10, 0.28);
            --hd-text: #f5f2d0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--hd-bg);
            color: var(--hd-text);
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            border: 1px solid var(--hd-border);
        }

        #titlebar {
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0 0 16px;
            background: var(--hd-panel);
            border-bottom: 1px solid var(--hd-border);
            -webkit-app-region: drag;
        }

        #title {
            color: var(--hd-yellow);
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0;
            white-space: nowrap;
        }

        #close-btn {
            width: 46px;
            height: 42px;
            border: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: var(--hd-text);
            cursor: pointer;
            -webkit-app-region: no-drag;
        }

        #close-btn:hover {
            background: #b91c1c;
            color: #fff;
        }

        #close-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2.2;
        }

        #pay-view {
            width: 100%;
            height: calc(100vh - 42px);
            background: #fff;
        }

        #loading {
            position: absolute;
            left: 0;
            right: 0;
            top: 42px;
            bottom: 0;
            display: grid;
            place-items: center;
            background: #050505;
            color: var(--hd-yellow);
            font-size: 14px;
            font-weight: 700;
            pointer-events: none;
        }

        body.loaded #loading { display: none; }
    </style>
</head>
<body>
    <div id="titlebar">
        <div id="title">感谢您的赞助</div>
        <button id="close-btn" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 24 24" fill="none">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>
    <webview id="pay-view" allowpopups></webview>
    <div id="loading">正在加载支付页面...</div>

    <script>
        const payView = document.getElementById('pay-view');

        document.getElementById('close-btn').addEventListener('click', () => {
            window.electronAPI.closeSponsorWindow();
        });

        window.electronAPI.onSponsorUrl((url) => {
            if (!url) return;
            document.body.classList.remove('loaded');
            payView.src = url;
        });

        payView.addEventListener('did-stop-loading', () => {
            document.body.classList.add('loaded');
        });
    </script>
</body>
</html>
