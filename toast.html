<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            width: 100vw; height: 100vh; overflow: hidden; background: transparent;
            display: flex; align-items: center; justify-content: center;
            font-family: system-ui, "Segoe UI", Arial, sans-serif;
        }
        #toast {
            max-width: calc(100vw - 24px);
            padding: 14px 26px;
            border-radius: 999px;
            background: rgba(255, 232, 10, 0.94);
            color: #000;
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 24px rgba(255, 232, 10, 0.22);
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            transform: translateY(22px) scale(0.98);
            transition: opacity 180ms ease, transform 180ms ease;
        }
        #toast.show { opacity: 1; transform: translateY(0) scale(1); }
        #toast.error {
            background: rgba(255, 69, 58, 0.94);
            color: #fff;
            box-shadow: 0 0 24px rgba(255, 69, 58, 0.28);
        }
    </style>
</head>
<body>
    <div id="toast"></div>
    <script>
        const toast = document.getElementById('toast');
        let hideTimer = null;

        window.electronAPI.onShowToast((payload) => {
            const data = payload || {};
            toast.textContent = data.message || '';
            toast.className = data.isError ? 'error show' : 'show';
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, data.duration || 2200);
        });
    </script>
</body>
</html>
